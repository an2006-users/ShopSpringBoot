spring.application.name=ShopSpringBoot
server.port=8090

# ---------------- View resolver (JSP nằm trong src/main/resources/META-INF/WEB-INF/views) ----------------
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# File tĩnh (css, js) trong src/main/resources/static -> URL /static/...
spring.mvc.static-path-pattern=/static/**

# ---------------- SiteMesh ----------------
# Dùng filter tự đăng ký (CustomSiteMeshFilter, bean tên "sitemesh") thay cho view-resolver mặc định của starter
sitemesh.integration=filter

# ---------------- SQL Server ----------------
# Tạo database trước:  CREATE DATABASE ShopSpringBoot;   (xem sql/create-database.sql)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ShopSpringBoot;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456

# ---------------- JPA / Hibernate ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Tài khoản admin được tạo sẵn lần chạy đầu tiên
app.admin.username=admin
app.admin.password=admin123
